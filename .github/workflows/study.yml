name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REPOSITORY: kchabin/kchblog

jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest

    steps:
      # 1. 체크아웃
      - name: Checkout source
        uses: actions/checkout@v3

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      # 3. Gradle 캐시 설정
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 4. Gradle 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. Gradle 테스트
      - name: Run tests
        run: ./gradlew test

      # 6. 테스트 결과 업로드
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'

      # 7. JAR 아티팩트 업로드
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: '**/build/libs/*.jar'

      # 8. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 9. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.REPOSITORY }}:${{ github.run_number }}
          LATEST=${{ env.REPOSITORY }}:latest
          
          docker build -t $IMAGE .
          docker tag $IMAGE $LATEST
          
          docker push $IMAGE
          docker push $LATEST

      # 10. 로컬 이미지 정리 (선택)
      - name: Remove local Docker images
        if: always()
        run: |
          docker rmi ${{ env.REPOSITORY }}:${{ github.run_number }} || true
          docker rmi ${{ env.REPOSITORY }}:latest || true
